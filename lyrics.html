  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;box-shadow:0 18px 40px -22px rgba(50,36,68,.5);display:block;\">\n      <div>\n        <p style=\"margin:0 0 14px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:11px;letter-spacing:.32em;color:rgba(50,36,68,.5);\">LYRICS ／ 歌詞と意訳<\u002Fp>\n        <h1 style=\"margin:0 0 10px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,6vw,64px);line-height:1.1;letter-spacing:.01em;color:#322444;\">Dalai Lama<\u002Fh1>\n        <p style=\"margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:15px;letter-spacing:.14em;color:rgba(50,36,68,.65);\">仏教経典にもとづく全6曲　経文とその意訳<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:44px 0 0;font-family:'Shippori Mincho',serif;font-weight:400;font-size:15px;line-height:2.4;letter-spacing:.05em;color:rgba(50,36,68,.8);text-wrap:pretty;\">アルバム「Dalai Lama」の各曲は、般若心経をはじめとする仏教経典・真言をもとにしています。ここでは、歌われている経文と、その心をひらいた意訳をご紹介します。<\u002Fp>\n\n    <div style=\"margin-top:40px;padding:30px 36px;background:#FFFFFF;border:1px solid rgba(50,36,68,.1);border-radius:6px;\">\n      <p style=\"margin:0 0 16px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:11px;letter-spacing:.3em;color:rgba(50,36,68,.5);\">TRACKLIST ／ 曲順<\u002Fp>\n      <sc-for list=\"{{ tracklist }}\" as=\"tr\" hint-placeholder-count=\"6\">\n        <p style=\"margin:0 0 6px;font-family:'Shippori Mincho',serif;font-weight:500;font-size:15px;line-height:2;letter-spacing:.08em;color:rgba(50,36,68,.82);\">{{ tr }}<\u002Fp>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Songs -->\n  <div style=\"max-width:820px;margin:0 auto;padding:72px 32px 120px;display:flex;flex-direction:column;gap:0;\">\n    <sc-for list=\"{{ songs }}\" as=\"song\" hint-placeholder-count=\"6\">\n      <div style=\"border-top:1px solid rgba(50,36,68,.14);padding:64px 0 68px;\">\n        <div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:8px;\">\n          <span style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:44px;line-height:1;color:rgba(201,90,146,.45);\">{{ song.no }}<\u002Fspan>\n          <div>\n            <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:32px;line-height:1.2;letter-spacing:.01em;color:#322444;\">{{ song.en }}<\u002Fh2>\n            <p style=\"margin:6px 0 0;font-family:'Shippori Mincho',serif;font-weight:600;font-size:17px;letter-spacing:.12em;color:rgba(50,36,68,.75);\">{{ song.ja }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:34px;padding:34px 38px;background:#FFFFFF;border:1px solid rgba(50,36,68,.1);border-radius:6px;box-shadow:0 24px 50px -38px rgba(50,36,68,.35);\">\n          <p style=\"margin:0 0 18px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:11px;letter-spacing:.3em;color:rgba(201,90,146,.75);\">経文<\u002Fp>\n          <sc-for list=\"{{ song.sutra }}\" as=\"line\" hint-placeholder-count=\"3\">\n            <p style=\"margin:0 0 .9em;font-family:'Shippori Mincho',serif;font-weight:500;font-size:17px;line-height:2.3;letter-spacing:.1em;color:#322444;text-wrap:pretty;\">{{ line }}<\u002Fp>\n          <\u002Fsc-for>\n          <p style=\"margin:14px 0 0;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;font-size:12px;letter-spacing:.1em;color:rgba(50,36,68,.5);\">{{ song.source }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:36px;\">\n          <p style=\"margin:0 0 18px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:11px;letter-spacing:.3em;color:rgba(50,36,68,.5);\">意訳<\u002Fp>\n          <sc-for list=\"{{ song.trans }}\" as=\"tline\" hint-placeholder-count=\"4\">\n            <p style=\"margin:0 0 1.1em;font-family:'Shippori Mincho',serif;font-weight:400;font-size:15.5px;line-height:2.35;letter-spacing:.05em;color:rgba(50,36,68,.84);text-wrap:pretty;\">{{ tline }}<\u002Fp>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ song.note }}\">\n            <p style=\"margin:10px 0 0;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;font-size:12.5px;line-height:2;letter-spacing:.06em;color:rgba(50,36,68,.55);\">{{ song.note }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"border-top:1px solid rgba(50,36,68,.14);padding-top:48px;text-align:center;\">\n      <a href=\"https://linkco.re/cN6Efcvb?lang=jp\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;padding:14px 34px;border:1px solid rgba(50,36,68,.3);border-radius:999px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;font-size:13px;letter-spacing:.18em;color:#322444;text-decoration:none;\">アルバムを聴く・購入する<\u002Fa>\n      <p style=\"margin:26px 0 0;\"><a href=\"./index.html\" style=\"font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;letter-spacing:.2em;color:rgba(50,36,68,.55);text-decoration:none;\">← Aminadabu トップへ戻る<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      tracklist: [\n        '1. Shiki soku Ku　色即空',\n        '2. Peace Pagoda　平和パゴダ',\n        '3. Wisdom Ocean　智慧の海',\n        '4. Aiyu-sui　愛癒水',\n        '5. Twelve Lights　十二光',\n        '6. Kanzeon　観世音',\n      ],\n      songs: [\n        {\n          no: '1', en: 'Shiki soku Ku', ja: '色即空',\n          sutra: [\n            '諦羯諦　波羅羯諦　波羅僧羯諦　羯諦羯諦　波羅羯諦　波羅僧羯諦',\n            '摩訶般若波羅蜜心経　観自在菩薩　行深般若波羅蜜時　照見五蘊皆空',\n            '度一切苦厄　舎利子　色不異空　空不異色　色即是空　空即是色',\n          ],\n          source: '＊「般若心経」より',\n          trans: [\n            'さあ、悟りに目覚めよう。いつでも、いま直ちに目覚めよう。',\n            '川を渡り、浄土の悟りへと至る智慧は、観自在菩薩の慈悲から生まれました。',\n            'いま起きていることはすべて、あなたの心が創り出したものであり、やがて消えゆく途中にあります。',\n            'そのことに目覚めるとき、苦しみは消え、あなたは自らの人生を、自らの手で創りはじめます。',\n            'あなたの人生を含むすべての現象は、心が創り出しているのですから。',\n          ],\n        },\n        {\n          no: '2', en: 'Peace Pagoda', ja: '平和パゴダ',\n          sutra: [\n            '一心頂礼　万徳円満　釈迦如来　真身舎利　本地法身',\n            '法界塔婆　我等礼敬　為我現身　入我我入　仏加持故',\n            '我証菩提　以仏神力　利益衆生　発菩提心　修菩薩行',\n            '同入円寂　平等大智　今将頂礼',\n          ],\n          source: '＊「舎利礼文」より',\n          trans: [\n            '心をひとつに集中し、仏を礼拝いたします。仏よ、あなたは宇宙に満ちる功徳そのもの。',\n            'その心と身体と遺骨の真実の姿は、宇宙の大いなる霊性です。',\n            '仏の魂はパゴダに宿り、それは三千世界そのもの。パゴダを礼拝するとき、私は仏の中に入り、仏は私の心に現れます。',\n            '仏の力をいただいて悟りに目覚め、その威神力をもって、人々に功徳をめぐらせます。',\n            'だからこそ悟りを求め、菩薩の行いにこの身を捧げるのです。いま、共に仏を礼拝いたしましょう。',\n            '深い悟りの世界に入るとき、あなたの存在そのものから、不二の智慧が生まれます。',\n          ],\n        },\n        {\n          no: '3', en: 'Wisdom Ocean', ja: '智慧の海',\n          sutra: [\n            'オンボウジシッター　ボーダハダヤミー',\n            'オンサンマヤ　サードバン',\n            '願似此功徳　平等施一切　同発菩提心　往生安楽国',\n          ],\n          source: '＊「発菩提心真言」「三昧耶戒真言」および「総回向偈」より',\n          trans: [\n            '悟りの智慧と、修行へと向かう揺るぎない志を求めましょう。',\n            'あなたは誓いを果たし、生きとし生けるものすべての幸せを願う菩薩なのですから。',\n            'この修行の功徳を、あまねくすべての存在に捧げられますように。',\n            '誰もが悟りを求める心を起こし、無限の喜びと安らぎの世界に、共に生まれゆけますように。',\n          ],\n        },\n        {\n          no: '4', en: 'Aiyu-sui', ja: '愛癒水',\n          sutra: ['南無アミリタ'],\n          source: '',\n          trans: [\n            '天の甘露のように、永遠の若さと命を与えてくださる阿弥陀仏に、帰依いたします。',\n          ],\n          note: '＊アミリタとは、永遠の若さと命を与える「天の水」のことです。',\n        },\n        {\n          no: '5', en: 'Twelve Lights', ja: '十二光',\n          sutra: [\n            '無量光仏　無辺光仏　無碍光仏　無対光仏',\n            '炎王光仏　清浄光仏　歓喜光仏　智慧光仏',\n            '不断光仏　難思光仏　無称光仏　超日月光仏',\n            '一切精霊生極楽　上品蓮台成正覚',\n          ],\n          source: '＊「無量寿経」および「大日経」より',\n          trans: [\n            '量ることのできない光、果てのない光、何ものにも妨げられない光、比べるもののない光、炎の王のごとく輝く光——その仏の光を讃えます。',\n            '清らかな光、歓喜の光、智慧の光、絶えることのない光——その仏の光を讃えます。',\n            '思いはかることのできない光、言葉に尽くせない光、日と月を超える光——その仏の光を讃えます。',\n            '救われぬすべての精霊が、無限の喜びの世界・極楽に生まれ変わり、最上の蓮の台の上で悟りを得られますように。',\n          ],\n        },\n        {\n          no: '6', en: 'Kanzeon', ja: '観世音',\n          sutra: [\n            '観世音　観世音　ボーディ・サットヴァ　南無アミリタ',\n            '観世音　南無佛　与佛有因　与佛有縁　佛法僧縁　常楽我浄',\n            '朝念観世音　暮念観世音　念念従心起　念念不離心',\n          ],\n          source: '＊「延命十句観音経」より　＊コーラス：「観音経」（法華経）より',\n          trans: [\n            '観世音菩薩よ、私は仏に帰依いたします。生きとし生けるものすべての苦しみが、癒されますように。',\n            '仏とその教えによって、心のいちばん深くにある仏性に目覚めます。',\n            'その目覚めの功徳と、絶えざる浄化と心の喜びを、縁あるすべての人々と分かち合います。',\n            '功徳を分かち合うために、朝目覚めるときも、夜眠りにつくときも、観世音を心に念じます。',\n            '心に何が起ころうとも、この祈りがあなたから離れることはありません。',\n          ],\n        },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
